[project]
name = "cortex-vault"
version = "0.1.0"
description = "Cortex skill vault tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
cortex = "cortex_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_cli"]
